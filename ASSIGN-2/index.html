<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            background-color: antiquewhite;
        }

        #fieldset {
            background-color: #fff;
        }
    </style>

</head>

<body>
    <div>
        <h1 style="margin-left: 40%; text-decoration: underline;"> Registration Form </h1>
        <h3> &#8226 Please fill the following details and upload the required documents to apply for admission.
        </h3>
    </div>
    <div>
        <form action="">
            <fieldset id="fieldset">
                <div id="Personal Information">
                    <fieldset>
                        <legend>
                            <h2> Personal Information </h2>
                        </legend>


                        <label for="Fullname">Enter Your Full name : </label>
                        <input type="text" id="Fullname" placeholder=" Enter your name">

                        <br><br>

                        <label for="Email">Enter Your Email : </label>
                        <input type="email" id="Email" placeholder='Enter your email id'>

                        <br> <br>

                        <label for="phone">Enter Your Phone Number:</label>
                        <input type="number" id="phone" placeholder="Enter your number" pattern="[0-9]{10}" required>

                        <br><br>

                        <label for="date">Enter Your DOB : </label>
                        <input type="date" id="date">

                        <br><br>


                        <label for="password">Enter Your Password : </label>
                        <input type="password" id=password placeholder="Enter your password" minlength="6" required>

                        <br><br>
                        <p>Gender:</p>

                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>

                        <input type="radio" id="other" name="gender" value="Other">
                        <label for="other">Other</label>
                        <br><br>

                        <label for="address">Address:</label>
                        <br><br>
                        <textarea id="address" name="address" rows="7" cols="50" placeholder="Enter your full address"
                            minlength="50" maxlength="200" required></textarea>
                        <br><br>


                    </fieldset>

                </div>

                <fieldset>
                    <legend>
                        <h2>Acedmic details</h2>
                    </legend>

                    <label for="Qualification">Enter Your std 10th Marks:</label>
                    <input type="number" id="Qualification" placeholder="Enter your marks" pattern="[0-100]{101}"
                        required>

                    <br><br>
                    <label for="Qualification">Enter Your std 12th Marks:</label>
                    <input type="number" id="Qualification" placeholder="Enter your marks" pattern="[0-100]{101}"
                        required>

                    <br><br>



                    <p>Select Your Interests :</p>

                    <input type="checkbox" id="coding" name="interests[]" value="Coding">
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="sports" name="interests[]" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music" name="interests[]" value="Music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="reading" name="interests[]" value="Reading">
                    <label for="reading">Reading</label>

                    <br><br>
                </fieldset>

                <fieldset>
                    <legend>
                        <h2>Course preference</h2>
                    </legend>


                    <label for="course">Select Course : </label>
                    <select name="Course" id="course">
                        <option value="">Select Course</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                        <option value="BBA">BBA</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br><br>
                </fieldset>





                <fieldset>
                    <legend>
                        <h2>Upload Documents</h2>
                    </legend>
                    <br>

                    <label for="photo">Upload Photograph:</label>
                    <input type="file" id="photo" name="photo" accept=".jpg,.ipng,.pdf" required>

                    <br><br>

                    <label for="documents">Upload Your 10th Marksheet:</label>
                    <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx" required>
                    <br><br>

                    <label for="documents">Upload Your 12th Marksheet:</label>
                    <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx" required>
                </fieldset>

                <br><br>


                <h2>Declaration</h2>


                <input type="checkbox" id="declaration" name="declaration" value="accepted" required>

                <label for="declaration">
                    I hereby declare that all the information provided is correct.
                </label>

                <br><br>

                <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                    <button type="submit">Submit</button>
                    <button type="reset" style=" margin: left 5px; ;">Reset</button>

                </div>


                <br><br>
            </fieldset>
        </form>

        <marquee behavior="" direction="left" scrollamount="15" style="background-color: white; color: #f47777;">
            <h3>Admission Open for Batch: 2026-30 </h3>
        </marquee>
    </div>
</body>

</html>
